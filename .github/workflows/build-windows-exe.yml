name: 构建 Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven 构建
        shell: pwsh
        run: mvn -B clean verify

      # jpackage 在 Windows 上生成 exe / msi 需要 WiX Toolset 3.x 的 candle.exe、light.exe
      - name: 准备 WiX Toolset 3
        shell: pwsh
        run: |
          $missing = @('candle.exe', 'light.exe') | Where-Object {
            -not (Get-Command $_ -ErrorAction SilentlyContinue)
          }
          if ($missing.Count -gt 0) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ }
            $wixBin = $roots | ForEach-Object {
              Get-ChildItem -Path "$($_)\WiX Toolset v3.*\bin" -Directory -ErrorAction SilentlyContinue
            } | Select-Object -First 1 -ExpandProperty FullName
            if (-not $wixBin) {
              throw '未找到 WiX Toolset v3，jpackage 无法生成 exe 安装包'
            }
            Add-Content -Path $env:GITHUB_PATH -Value $wixBin
            Write-Host "已加入 PATH：$wixBin"
          }

      - name: jpackage 打包 exe
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path 'target\qr-ocr-*.jar' | Select-Object -First 1
          if (-not $jar) {
            throw '未找到 Maven 构建产物 jar'
          }
          New-Item -ItemType Directory -Force -Path 'target\jpackage-input\lib' | Out-Null
          Copy-Item $jar.FullName 'target\jpackage-input\'
          Copy-Item 'target\lib\*.jar' 'target\jpackage-input\lib\'
          $version = ($jar.BaseName -replace '^qr-ocr-', '') -replace '-SNAPSHOT$', ''
          if ($version -notmatch '^\d+(\.\d+){0,3}$') {
            $version = '1.0.0'
          }
          jpackage `
            --type exe `
            --input 'target\jpackage-input' `
            --main-jar $jar.Name `
            --main-class 'me.yoqi.qr.Launcher' `
            --name 'zz-qr' `
            --app-version $version `
            --vendor 'yoqi' `
            --description 'XiaoZhou PC QR Code Reader' `
            --icon 'src\main\deploy\package\windows\treehole.ico' `
            --dest 'target\native' `
            --win-menu `
            --win-menu-group 'zz-qr' `
            --win-shortcut `
            --win-dir-chooser `
            --win-upgrade-uuid 'f4132b7c-b0aa-4f09-8df0-d93aa4556134'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: 上传 exe 安装包
        uses: actions/upload-artifact@v4
        with:
          name: zz-qr-windows-exe
          path: target/native/*.exe
          if-no-files-found: error
          retention-days: 30
